# Config overlay for the integration test against TESK (`compose.yaml`), as
# `../config.yaml`: the fake identity provider issues the tokens of users, and
# proTES has no credentials at TESK, which runs in its mode `noauth`
security:
  auth:
    issuers:
      - http://fake-tes:8080/oidc/
    audience:
      - smoke-client
    userinfo_claims:
      - groups
  access_control:
    claim_groups: groups
    group_mapping:
      smoke-users: user
      smoke-admins: admin
custom:
  tes:
    backends:
      - type: ga4gh-tes
        url: http://k3s:31567
        url_schemes:
          - http
        auth: none
    url_schemes:
      - http
  controllers:
    post_task:
      polling:
        wait: 1
plugins:
  pipeline:
    - id: route
      alternatives:
        - plugin: foca.routing.ordered
