# Config overlay for the integration test (`compose.yaml`): tasks go to real
# TES implementations, which they choose with the tag `gateway.backends`
# (`check.sh`). The fake identity provider of the smoke test
# (`../smoke/fake_tes.py`, not used as a TES backend here) issues the tokens of
# users; proTES has no credentials at the backends, as they require none
security:
  auth:
    issuers:
      - http://fake-tes:8080/oidc/
    audience:
      - smoke-client
    userinfo_claims:
      - groups
  access_control:
    claim_groups: groups
    group_mapping:
      smoke-users: user
      smoke-admins: admin
custom:
  tes:
    backends:
      # Funnel 0.12.3 reports TES 1.1.0 itself; the label, which versions
      # before 0.12.3 need, keeps that path of the config tested (the CI
      # job's entry `label`; `config-service-info.yaml` is this file without
      # it, for the entry `service info`)
      - type: ga4gh-tes
        url: http://funnel:8000
        url_schemes:
          - http
        auth: none
        labels:
          tes.version: "1.1"
      # Serves the TES API at `/v1` only
      - type: ga4gh-tes
        url: http://tesp-api:8080
        api_path: /v1
        url_schemes:
          - http
        auth: none
    url_schemes:
      - http
  controllers:
    post_task:
      polling:
        wait: 1
plugins:
  pipeline:
    - id: route
      alternatives:
        - plugin: foca.routing.ordered
