# Config overlay for the integration test (`compose.yaml`), as `config.yaml`
# but without the label `tes.version` of Funnel, so that proTES reads Funnel's
# TES version from its service info: the entry `service info` of CI's job
# `integration` (`INTEGRATION_CONFIG`). `tests/test_workflows.py` checks that
# the two files differ in that label only
security:
  auth:
    issuers:
      - http://fake-tes:8080/oidc/
    audience:
      - smoke-client
    userinfo_claims:
      - groups
  access_control:
    claim_groups: groups
    group_mapping:
      smoke-users: user
      smoke-admins: admin
custom:
  tes:
    backends:
      # Funnel 0.12.3 reports TES 1.1.0 in its service info, which proTES
      # reads, as there is no label `tes.version`
      - type: ga4gh-tes
        url: http://funnel:8000
        url_schemes:
          - http
        auth: none
      # Serves the TES API at `/v1` only
      - type: ga4gh-tes
        url: http://tesp-api:8080
        api_path: /v1
        url_schemes:
          - http
        auth: none
    url_schemes:
      - http
  controllers:
    post_task:
      polling:
        wait: 1
plugins:
  pipeline:
    - id: route
      alternatives:
        - plugin: foca.routing.ordered
