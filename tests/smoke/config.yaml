# Config overlay for the Compose smoke test (`tests/smoke/compose.yaml`):
# tasks go to the fake TES backends only (no public TES instances), with an
# explicit plugin pipeline (ordered failover), so to the one of TES 1.0 first,
# unless they need TES 1.1; the fake backend of TES 1.1 is also the identity
# provider (`fake_tes.py`)
security:
  auth:
    issuers:
      - http://fake-tes:8080/oidc/
    audience:
      - smoke-client
    userinfo_claims:
      - groups
  access_control:
    claim_groups: groups
    group_mapping:
      smoke-users: user
      smoke-admins: admin
custom:
  # proTES authenticates at the fake backend with its own access token of the
  # fake identity provider (client ID and secret in `compose.yaml`), over
  # plain HTTP inside the Compose network
  tes:
    backends:
      - type: ga4gh-tes
        url: http://fake-tes-10:8080
        url_schemes:
          - http
        auth: none
      - type: ga4gh-tes
        url: http://fake-tes:8080
        url_schemes:
          - http
        auth: client_credentials
      # Serves the TES API at `/v1` only (as TESP does); only for tasks that
      # choose it, as the backends before it accept all others
      - type: ga4gh-tes
        url: http://fake-tes-v1:8080
        api_path: /v1
        url_schemes:
          - http
        auth: none
    url_schemes:
      - http
    client_credentials:
      issuer: http://fake-tes:8080/oidc/
  controllers:
    post_task:
      polling:
        wait: 1
plugins:
  # Explicit pipeline, FOCA's ordered failover (needs no network access)
  pipeline:
    - id: route
      alternatives:
        - plugin: foca.routing.ordered
