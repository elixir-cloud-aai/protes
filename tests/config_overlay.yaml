# Config overlay of the app tests, with the settings each deployment must
# make: a trusted issuer (mocked, see `tests/conftest.py`), the audience, the
# groups of the roles, and a TES backend (faked by the tests)
security:
  auth:
    issuers:
      - https://login.example.org/oidc/
    audience:
      - client-id
    userinfo_claims:
      - groups
  access_control:
    claim_groups: groups
    group_mapping:
      compute-users: user
      "urn:example:group:compute-admins#login.example.org": admin
# Ordered failover, so that tasks go to the backends in a fixed order and no
# lookups are attempted (the default pipeline is tested in
# `tests/ga4gh/tes/test_default_routing.py`)
plugins:
  pipeline:
    - id: route
      alternatives:
        - plugin: foca.routing.ordered
custom:
  tes:
    backends:
      - type: ga4gh-tes
        url: https://tes.example.org/
        auth: none
