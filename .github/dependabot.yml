version: 2
# Every entry targets `dev` (`target-branch`, set on the group for entries of
# a multi-ecosystem group), which takes all pull requests whatever the default
# branch is (`main` only moves forward to releases); security updates always
# target the default branch, though
multi-ecosystem-groups:
  # The images of MongoDB, RabbitMQ and Flower, which Docker Compose
  # (`docker-compose.yaml`) and the Helm chart (`deployment/values.yaml`) pin
  # to the same references (`tests/test_repository.py` checks), in one pull
  # request for both files
  service-images:
    schedule:
      interval: monthly
    target-branch: dev
updates:
  # Dependencies in `pyproject.toml` and the lock (`uv.lock`), updated
  # together; CI's checks and the image build (`Dockerfile`) install the
  # locked ones
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    versioning-strategy: increase-if-necessary
    ignore:
      # connexion 3 needs a FOCA upgrade
      - dependency-name: connexion
        update-types: ["version-update:semver-major"]
      # FOCA is bumped by hand, together with the base image (see the `docker`
      # entry): the image build fails unless the base image has the locked
      # FOCA, so separate pull requests of this entry and the `docker` entry
      # would each fail
      - dependency-name: foca
    groups:
      # Dependencies of the documentation (the `docs` extra), in pull
      # requests of their own
      docs-dependencies:
        patterns: [
          "griffelib", "mkdocs", "mkdocs-*", "mkdocstrings",
          "mkdocstrings-*", "pymdown-extensions",
        ]
      # Dependencies match the first group listed
      python-dependencies:
        patterns: ["*"]
        exclude-patterns: ["connexion", "foca"]
  # Actions in the workflows, including the pins of the shared actions of
  # `elixir-cloud-aai/.github` (to the commits of its releases,
  # `@<commit> # vX.Y.Z`)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    groups:
      github-actions:
        patterns: ["*"]
  # Base image and uv image in the `Dockerfile` (tag and digest)
  - package-ecosystem: docker
    # The image, and the uv stage of the recipe for plugin images
    directories: ["/", "/examples/plugin-image"]
    schedule:
      interval: monthly
    target-branch: dev
    ignore:
      # FOCA is bumped by hand, in the base image and the `foca` requirement
      # in `pyproject.toml` and `uv.lock` together (the image build fails
      # unless the base image has the locked FOCA; see the `uv` entry).
      # Digest updates of the same tag (e.g., OS package fixes) still come
      - dependency-name: elixircloud/foca
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      docker:
        patterns: ["*"]
  # Images of the services in `docker-compose.yaml` (see the group)
  - package-ecosystem: docker-compose
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: service-images
  # Images in the chart's values (`deployment/values.yaml`; see the group)
  - package-ecosystem: helm
    directory: /deployment
    patterns: ["*"]
    multi-ecosystem-group: service-images
    ignore:
      # FOCA's library chart is bumped by hand, with `Chart.lock` and
      # `charts.sha256` (see "Helm chart" in `docs/development.md`)
      - dependency-name: foca-common
  # Hook revisions in `.pre-commit-config.yaml`
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    groups:
      pre-commit:
        patterns: ["*"]
